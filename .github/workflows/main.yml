name: Update AltSource

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    paths:
      - config.json
      - .github/workflows/update.yml

permissions:
  contents: write

concurrency:
  group: altsource-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --prefix /tmp/altsource-deps adm-zip plist@3.1.0 bplist-parser@0.2.0

      - name: Generate AltSource
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NODE_PATH: /tmp/altsource-deps/node_modules
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const AdmZip = require("adm-zip");
          const plist = require("plist");
          const bplist = require("bplist-parser");

          const API = "https://api.github.com";
          const OUTPUT = "frizzlem.json";
          const CACHE = ".frizzlem-cache.json";
          const TOKEN = process.env.GITHUB_TOKEN;

          const readJson = (file, fallback) => {
            try {
              return JSON.parse(fs.readFileSync(file, "utf8"));
            } catch {
              return fallback;
            }
          };

          const writeJson = (file, data) =>
            fs.writeFileSync(file, JSON.stringify(data, null, 2) + "\n");

          const repoKey = (owner, name) =>
            `${owner.toLowerCase()}/${name.toLowerCase()}`;

          async function api(url) {
            const response = await fetch(url, {
              headers: {
                Accept: "application/vnd.github+json",
                Authorization: `Bearer ${TOKEN}`,
                "X-GitHub-Api-Version": "2022-11-28",
                "User-Agent": "AltSource-Generator"
              }
            });

            if (!response.ok) {
              throw new Error(`GitHub API returned ${response.status} for ${url}`);
            }

            return response.json();
          }

          async function download(url) {
            const response = await fetch(url);
            if (!response.ok) {
              throw new Error(`Download returned HTTP ${response.status}`);
            }
            return Buffer.from(await response.arrayBuffer());
          }

          function ipaAssets(release) {
            return (release.assets || []).filter(asset =>
              asset.state === "uploaded" &&
              asset.name.toLowerCase().endsWith(".ipa")
            );
          }

          function validReleases(releases) {
            return releases
              .filter(release =>
                !release.draft &&
                !release.prerelease &&
                ipaAssets(release).length > 0
              )
              .sort((a, b) =>
                (b.published_at || b.created_at || "").localeCompare(
                  a.published_at || a.created_at || ""
                )
              );
          }

          const versionOf = release =>
            (release.tag_name || release.name || "Unknown").replace(/^v/i, "");

          const dateOf = release =>
            release.published_at || release.created_at || "";

          const releaseKey = release => ({
            id: release.id,
            tag: release.tag_name,
            publishedAt: release.published_at,
            createdAt: release.created_at
          });

          async function releaseSnapshot(owner, name) {
            const pages = [];

            for (let page = 1; ; page++) {
              const releases = await api(
                `${API}/repos/${encodeURIComponent(owner)}/${encodeURIComponent(name)}/releases?per_page=100&page=${page}`
              );

              pages.push(releases);

              if (validReleases(pages.flat()).length || releases.length < 100) {
                break;
              }
            }

            return {
              pages,
              latest: validReleases(pages.flat())[0] || null
            };
          }

          async function allReleases(owner, name, pages) {
            for (let page = pages.length + 1; ; page++) {
              const releases = await api(
                `${API}/repos/${encodeURIComponent(owner)}/${encodeURIComponent(name)}/releases?per_page=100&page=${page}`
              );

              pages.push(releases);
              if (releases.length < 100) break;
            }

            return pages.flat();
          }

          function cleanMarkdown(text) {
            return text
              .replace(/!\[[^\]]*\]\([^)]*\)/g, "")
              .replace(/\[([^\]]+)\]\([^)]*\)/g, "$1")
              .replace(/<[^>]+>/g, "")
              .replace(/`{1,3}[^`]*`{1,3}/g, "")
              .replace(/[*_~>#]/g, "")
              .replace(/\s+/g, " ")
              .trim();
          }

          function readmeDescription(readme) {
            const paragraphs = [];
            let current = [];

            for (const raw of readme.split(/\r?\n/)) {
              const line = raw.trim();

              if (!line || line.startsWith("#") || line.startsWith("![")) {
                if (current.length) paragraphs.push(current.join(" "));
                current = [];
                continue;
              }

              const cleaned = cleanMarkdown(line);
              if (cleaned) current.push(cleaned);
            }

            if (current.length) paragraphs.push(current.join(" "));

            return paragraphs.find(text => text.length >= 20)?.slice(0, 4000) || "";
          }

          function readmeImages(readme) {
            const matches = [
              ...readme.matchAll(/!\[[^\]]*\]\((https?:\/\/[^)\s]+)[^)]*\)/g),
              ...readme.matchAll(/<img[^>]+src=["'](https?:\/\/[^"']+)["']/gi)
            ];

            return [...new Set(matches.map(match => match[1]).filter(url => {
              const lower = url.toLowerCase();
              return !lower.includes("shields.io") && !lower.includes("badge");
            }))];
          }

          async function readIpaInfo(url) {
            const zip = new AdmZip(await download(url));
            const entry = zip.getEntries().find(file =>
              /^Payload\/[^/]+\.app\/Info\.plist$/.test(file.entryName)
            );

            if (!entry) throw new Error("IPA is missing its app Info.plist");

            const data = entry.getData();
            let info;

            if (data.subarray(0, 8).toString("ascii") === "bplist00") {
              info = await new Promise((resolve, reject) => {
                bplist.parseBuffer(data, (error, result) => {
                  if (error) reject(error);
                  else resolve(result[0]);
                });
              });
            } else {
              info = plist.parse(data.toString("utf8"));
            }

            const primary = info.CFBundleIcons?.CFBundlePrimaryIcon || {};
            let iconFiles = primary.CFBundleIconFiles || [];

            if (typeof iconFiles === "string") iconFiles = [iconFiles];

            return {
              bundleIdentifier: info.CFBundleIdentifier || "",
              iconName: info.CFBundleIconName || primary.CFBundleIconName || "",
              iconFiles
            };
          }

          function iconSize(image) {
            const match = String(image.size || "").match(/([\d.]+)\s*[x×]\s*([\d.]+)/);
            return match ? Number(match[1]) * Number(match[2]) : 0;
          }

          function rawUrl(owner, name, branch, file) {
            return `https://raw.githubusercontent.com/${owner}/${name}/${encodeURIComponent(branch)}/${file.split("/").map(encodeURIComponent).join("/")}`;
          }

          async function findIcon(owner, name, branch, ipaInfo) {
            const repo = `${API}/repos/${encodeURIComponent(owner)}/${encodeURIComponent(name)}`;
            const treeData = await api(
              `${repo}/git/trees/${encodeURIComponent(branch)}?recursive=1`
            );
            const tree = treeData.tree || [];

            const sets = tree.filter(file =>
              file.type === "tree" &&
              file.path.toLowerCase().endsWith(".appiconset")
            );

            const iconName = ipaInfo.iconName.toLowerCase();
            const selectedSet = sets.find(file =>
              path.posix.basename(file.path).replace(/\.appiconset$/i, "").toLowerCase() === iconName
            );

            if (selectedSet) {
              const contentsPath = `${selectedSet.path}/Contents.json`;
              const contentsData = await api(
                `${repo}/contents/${contentsPath.split("/").map(encodeURIComponent).join("/")}?ref=${encodeURIComponent(branch)}`
              );
              const contents = JSON.parse(
                Buffer.from(contentsData.content, "base64").toString("utf8")
              );

              const candidates = (contents.images || [])
                .filter(image =>
                  image.filename &&
                  !(image.appearances || []).some(appearance =>
                    appearance.appearance === "luminosity"
                  )
                )
                .sort((a, b) =>
                  iconSize(b) - iconSize(a) ||
                  (Number(String(b.scale || "").replace("x", "")) || 0) -
                  (Number(String(a.scale || "").replace("x", "")) || 0)
                );

              if (candidates.length) {
                return rawUrl(
                  owner,
                  name,
                  branch,
                  `${selectedSet.path}/${candidates[0].filename}`
                );
              }
            }

            for (const iconFile of ipaInfo.iconFiles) {
              const filename = path.posix.basename(iconFile);
              const found = tree.find(file =>
                file.type === "blob" &&
                path.posix.basename(file.path).toLowerCase() === filename.toLowerCase()
              );

              if (found) return rawUrl(owner, name, branch, found.path);
            }

            return "";
          }

          function versionEntry(release) {
            const asset = ipaAssets(release)[0];

            return {
              version: versionOf(release),
              date: dateOf(release),
              downloadURL: asset.browser_download_url,
              localizedDescription: (release.body || "").trim(),
              size: asset.size || 0
            };
          }

          async function buildApp(owner, name, repository, releases, maxVersions) {
            const qualifying = validReleases(releases).slice(0, maxVersions);
            if (!qualifying.length) return null;

            const latest = qualifying[0];
            const latestAsset = ipaAssets(latest)[0];
            const ipaInfo = await readIpaInfo(latestAsset.browser_download_url);

            if (!ipaInfo.bundleIdentifier) {
              throw new Error("Could not read the app bundle identifier");
            }

            let readme = "";

            try {
              const result = await api(
                `${API}/repos/${encodeURIComponent(owner)}/${encodeURIComponent(name)}/readme`
              );

              if (result.encoding === "base64") {
                readme = Buffer.from(result.content, "base64").toString("utf8");
              }
            } catch {
              console.log(`  README unavailable`);
            }

            let iconURL = "";

            try {
              iconURL = await findIcon(
                owner,
                name,
                repository.default_branch || "main",
                ipaInfo
              );
            } catch {
              console.log(`  Icon unavailable`);
            }

            const versions = qualifying.map(versionEntry);
            const description = (repository.description || "").trim() || name;

            const app = {
              bundleIdentifier: ipaInfo.bundleIdentifier,
              name,
              developerName: owner,
              iconURL,
              subtitle: description,
              localizedDescription: readmeDescription(readme) || description,
              version: versions[0].version,
              versionDate: versions[0].date,
              versionDescription: versions[0].localizedDescription,
              downloadURL: `https://github.com/${encodeURIComponent(owner)}/${encodeURIComponent(name)}/releases/latest/download/${encodeURIComponent(latestAsset.name)}`,
              size: latestAsset.size || 0,
              versions
            };

            const screenshots = readmeImages(readme);
            if (screenshots.length) app.screenshotURLs = screenshots;

            return { releaseKey: releaseKey(latest), app };
          }

          async function main() {
            const config = readJson("config.json", null);
            if (!config) throw new Error("config.json is missing or invalid");

            const sourceConfig = config.source || {};
            const output = config.output || OUTPUT;
            const cache = readJson(CACHE, { repositories: {} });

            if (!cache.repositories) cache.repositories = {};

            const repositories = config.repositories || [];
            const maxVersions = Math.max(1, Number(config.max_versions) || 50);
            const configuredKeys = new Set(
              repositories.map(item => repoKey(item.owner || "", item.name || ""))
            );

            for (const key of Object.keys(cache.repositories)) {
              if (!configuredKeys.has(key)) delete cache.repositories[key];
            }

            const source = {
              name: sourceConfig.name,
              identifier: sourceConfig.identifier,
              iconURL: sourceConfig.iconURL,
              apps: [],
              version: sourceConfig.version ?? 1,
              apiVersion: sourceConfig.apiVersion ?? "v1"
            };

            for (const item of repositories) {
              const owner = String(item.owner || "").trim();
              const name = String(item.name || "").trim();

              if (!owner || !name) {
                console.log("Skipping repository with missing owner or name");
                continue;
              }

              const key = repoKey(owner, name);
              const cached = cache.repositories[key];

              console.log(`Checking ${owner}/${name}`);

              try {
                const snapshot = await releaseSnapshot(owner, name);

                if (!snapshot.latest) {
                  if (cached?.app) {
                    source.apps.push(cached.app);
                    console.log("  No eligible IPA release; using cache");
                  } else {
                    console.log("  No published IPA releases found");
                  }
                  continue;
                }

                const latestKey = releaseKey(snapshot.latest);
                const unchanged =
                  cached?.app &&
                  JSON.stringify(cached.releaseKey) === JSON.stringify(latestKey) &&
                  Number(cached.maxVersions) === maxVersions;

                if (unchanged) {
                  source.apps.push(cached.app);
                  console.log(`  Unchanged: ${cached.app.version}`);
                  continue;
                }

                const releases = await allReleases(owner, name, snapshot.pages);
                const repository = await api(
                  `${API}/repos/${encodeURIComponent(owner)}/${encodeURIComponent(name)}`
                );

                const built = await buildApp(
                  owner,
                  name,
                  repository,
                  releases,
                  maxVersions
                );

                if (!built) throw new Error("No eligible IPA releases found");

                cache.repositories[key] = {
                  ...built,
                  maxVersions
                };

                source.apps.push(built.app);
                console.log(`  Updated: ${built.app.version} (${built.app.versions.length} versions)`);
              } catch (error) {
                console.error(`  Failed: ${error.message}`);

                if (cached?.app) {
                  source.apps.push(cached.app);
                  console.log("  Using cached app");
                }
              }
            }

            if (repositories.length && !source.apps.length) {
              throw new Error("No apps could be generated. See repository errors above.");
            }

            writeJson(output, source);
            writeJson(CACHE, cache);

            console.log(`Finished: ${source.apps.length} app(s) in ${output}`);
          }

          main().catch(error => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- frizzlem.json .frizzlem-cache.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update AltSource"
          git push
