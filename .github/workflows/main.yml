
name: Update AltSource

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    paths:
      - config.json
      - .github/workflows/update.yml

permissions:
  contents: write

concurrency:
  group: altsource-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --prefix /tmp/altsource-deps adm-zip plist@3.1.0

      - name: Generate AltSource
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NODE_PATH: /tmp/altsource-deps/node_modules
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const { execFileSync } = require("child_process");
          const AdmZip = require("adm-zip");
          const plist = require("plist");

          const API = "https://api.github.com";
          const CACHE_FILE = ".frizzlem-cache.json";
          const TOKEN = process.env.GITHUB_TOKEN;

          const readJson = (file, fallback) => {
            try {
              return JSON.parse(fs.readFileSync(file, "utf8"));
            } catch {
              return fallback;
            }
          };

          const writeJson = (file, value) => {
            fs.writeFileSync(file, JSON.stringify(value, null, 2) + "\n");
          };

          const repoKey = (owner, name) =>
            `${owner.toLowerCase()}/${name.toLowerCase()}`;

          async function request(url, options = {}) {
            console.log(`  Request: ${url}`);

            const response = await fetch(url, {
              ...options,
              signal: AbortSignal.timeout(options.timeout || 60000),
              headers: {
                Accept: "application/vnd.github+json",
                Authorization: `Bearer ${TOKEN}`,
                "X-GitHub-Api-Version": "2022-11-28",
                "User-Agent": "Frizzlem-AltSource",
                ...options.headers
              }
            });

            if (!response.ok) {
              const body = (await response.text()).slice(0, 500);
              throw new Error(
                `HTTP ${response.status} for ${url}\n${body}`
              );
            }

            return response;
          }

          async function api(url) {
            return (await request(url)).json();
          }

          async function download(url) {
            const response = await request(url, {
              timeout: 180000,
              headers: {
                Accept: "*/*",
                Authorization: undefined,
                "X-GitHub-Api-Version": undefined
              }
            });

            return Buffer.from(await response.arrayBuffer());
          }

          function ipaAssets(release) {
            return (release.assets || []).filter(asset =>
              asset.state === "uploaded" &&
              asset.name.toLowerCase().endsWith(".ipa")
            );
          }

          function validReleases(releases) {
            return releases
              .filter(release =>
                !release.draft &&
                !release.prerelease &&
                ipaAssets(release).length > 0
              )
              .sort((a, b) =>
                (b.published_at || b.created_at || "").localeCompare(
                  a.published_at || a.created_at || ""
                )
              );
          }

          const versionOf = release =>
            (release.tag_name || release.name || "Unknown").replace(/^v/i, "");

          const dateOf = release =>
            release.published_at || release.created_at || "";

          const releaseKey = release => ({
            id: release.id,
            tag: release.tag_name,
            publishedAt: release.published_at,
            createdAt: release.created_at
          });

          async function allReleases(owner, name) {
            const result = [];

            for (let page = 1; ; page++) {
              const releases = await api(
                `${API}/repos/${encodeURIComponent(owner)}/${encodeURIComponent(name)}/releases?per_page=100&page=${page}`
              );

              result.push(...releases);
              console.log(`  Releases page ${page}: ${releases.length}`);

              if (releases.length < 100) break;
            }

            return result;
          }

          function cleanMarkdown(text) {
            return text
              .replace(/!\[[^\]]*\]\([^)]*\)/g, "")
              .replace(/\[([^\]]+)\]\([^)]*\)/g, "$1")
              .replace(/<[^>]+>/g, "")
              .replace(/`{1,3}[^`]*`{1,3}/g, "")
              .replace(/[*_~>#]/g, "")
              .replace(/\s+/g, " ")
              .trim();
          }

          function readmeDescription(readme) {
            const paragraphs = [];
            let current = [];

            for (const raw of readme.split(/\r?\n/)) {
              const line = raw.trim();

              if (
                !line ||
                line.startsWith("#") ||
                line.startsWith("![") ||
                line.startsWith("<img")
              ) {
                if (current.length) paragraphs.push(current.join(" "));
                current = [];
                continue;
              }

              const cleaned = cleanMarkdown(line);
              if (cleaned) current.push(cleaned);
            }

            if (current.length) paragraphs.push(current.join(" "));

            return paragraphs.find(value => value.length >= 20)?.slice(0, 4000) || "";
          }

          function readmeImages(readme) {
            const matches = [
              ...readme.matchAll(/!\[[^\]]*\]\((https?:\/\/[^)\s]+)[^)]*\)/g),
              ...readme.matchAll(/<img[^>]+src=["'](https?:\/\/[^"']+)["']/gi)
            ];

            return [...new Set(matches.map(match => match[1]).filter(url => {
              const lower = url.toLowerCase();
              return !lower.includes("shields.io") && !lower.includes("badge");
            }))];
          }

          function readIpaInfo(url) {
            console.log("  Downloading IPA and reading its Info.plist...");
            const zip = new AdmZip(downloadSync(url));
            const entry = zip.getEntries().find(file =>
              /^Payload\/[^/]+\.app\/Info\.plist$/.test(file.entryName)
            );

            if (!entry) {
              throw new Error("IPA does not contain Payload/<app>.app/Info.plist");
            }

            const data = entry.getData();

            // Python's standard library supports both binary and XML plists.
            const python = [
              "import base64, json, plistlib, sys",
              "p = plistlib.loads(base64.b64decode(sys.argv[1]))",
              "icons = p.get('CFBundleIcons', {}).get('CFBundlePrimaryIcon', {})",
              "print(json.dumps({",
              " 'bundleIdentifier': p.get('CFBundleIdentifier', ''),",
              " 'iconName': p.get('CFBundleIconName', icons.get('CFBundleIconName', '')),",
              " 'iconFiles': icons.get('CFBundleIconFiles', [])",
              "}))"
            ].join("\n");

            const result = execFileSync(
              "python3",
              ["-c", python, data.toString("base64")],
              { encoding: "utf8", timeout: 15000 }
            );

            const info = JSON.parse(result);
            if (!info.bundleIdentifier) {
              throw new Error("Info.plist has no CFBundleIdentifier");
            }

            if (typeof info.iconFiles === "string") {
              info.iconFiles = [info.iconFiles];
            }

            return info;
          }

          // Download synchronously with a bounded timeout to keep ZIP parsing simple.
          function downloadSync(url) {
            const script = [
              "import sys, urllib.request",
              "r = urllib.request.Request(sys.argv[1], headers={'User-Agent':'Frizzlem-AltSource'})",
              "with urllib.request.urlopen(r, timeout=180) as response:",
              " sys.stdout.buffer.write(response.read())"
            ].join("\n");

            return execFileSync("python3", ["-c", script, url], {
              encoding: "buffer",
              timeout: 210000,
              maxBuffer: 1024 * 1024 * 1024
            });
          }

          function rawUrl(owner, name, branch, file) {
            const branchPath = branch.split("/").map(encodeURIComponent).join("/");
            const filePath = file.split("/").map(encodeURIComponent).join("/");
            return `https://raw.githubusercontent.com/${owner}/${name}/${branchPath}/${filePath}`;
          }

          function iconSize(image) {
            const match = String(image.size || "").match(/([\d.]+)\s*[x×]\s*([\d.]+)/);
            return match ? Number(match[1]) * Number(match[2]) : 0;
          }

          async function findIcon(owner, name, branch, ipaInfo) {
            const repo = `${API}/repos/${encodeURIComponent(owner)}/${encodeURIComponent(name)}`;
            const treeData = await api(
              `${repo}/git/trees/${branch.split("/").map(encodeURIComponent).join("/")}?recursive=1`
            );
            const tree = treeData.tree || [];
            const iconName = (ipaInfo.iconName || "").toLowerCase();

            const sets = tree.filter(file =>
              file.type === "tree" &&
              file.path.toLowerCase().endsWith(".appiconset")
            );

            const selectedSet = sets.find(file =>
              path.posix.basename(file.path)
                .replace(/\.appiconset$/i, "")
                .toLowerCase() === iconName
            );

            if (selectedSet) {
              const contentsPath = `${selectedSet.path}/Contents.json`;
              const contentsData = await api(
                `${repo}/contents/${contentsPath.split("/").map(encodeURIComponent).join("/")}?ref=${encodeURIComponent(branch)}`
              );

              const contents = JSON.parse(
                Buffer.from(contentsData.content, "base64").toString("utf8")
              );

              const candidates = (contents.images || [])
                .filter(image =>
                  image.filename &&
                  !(image.appearances || []).some(appearance =>
                    appearance.appearance === "luminosity"
                  )
                )
                .sort((a, b) =>
                  iconSize(b) - iconSize(a) ||
                  (Number(String(b.scale || "").replace("x", "")) || 0) -
                  (Number(String(a.scale || "").replace("x", "")) || 0)
                );

              if (candidates.length) {
                return rawUrl(
                  owner, name, branch,
                  `${selectedSet.path}/${candidates[0].filename}`
                );
              }
            }

            for (const iconFile of ipaInfo.iconFiles || []) {
              const filename = path.posix.basename(iconFile);
              const found = tree.find(file =>
                file.type === "blob" &&
                path.posix.basename(file.path).toLowerCase() === filename.toLowerCase()
              );

              if (found) return rawUrl(owner, name, branch, found.path);
            }

            return "";
          }

          function versionEntry(release) {
            const asset = ipaAssets(release)[0];

            return {
              version: versionOf(release),
              date: dateOf(release),
              downloadURL: asset.browser_download_url,
              localizedDescription: (release.body || "").trim(),
              size: asset.size || 0
            };
          }

          async function buildApp(owner, name, repository, releases, maxVersions) {
            const qualifying = validReleases(releases).slice(0, maxVersions);
            if (!qualifying.length) {
              throw new Error("No published, non-prerelease release with an IPA asset was found");
            }

            const latest = qualifying[0];
            const latestAsset = ipaAssets(latest)[0];
            const ipaInfo = readIpaInfo(latestAsset.browser_download_url);

            let readme = "";

            try {
              const result = await api(
                `${API}/repos/${encodeURIComponent(owner)}/${encodeURIComponent(name)}/readme`
              );

              if (result.encoding === "base64") {
                readme = Buffer.from(result.content, "base64").toString("utf8");
              }
            } catch (error) {
              console.log(`  README unavailable: ${error.message}`);
            }

            let iconURL = "";

            try {
              iconURL = await findIcon(
                owner,
                name,
                repository.default_branch || "main",
                ipaInfo
              );
            } catch (error) {
              console.log(`  Icon lookup failed: ${error.message}`);
            }

            const versions = qualifying.map(versionEntry);
            const description = (repository.description || "").trim() || name;

            const app = {
              bundleIdentifier: ipaInfo.bundleIdentifier,
              name,
              developerName: owner,
              iconURL,
              subtitle: description,
              localizedDescription: readmeDescription(readme) || description,
              version: versions[0].version,
              versionDate: versions[0].date,
              versionDescription: versions[0].localizedDescription,
              downloadURL: `https://github.com/${owner}/${name}/releases/latest/download/${encodeURIComponent(latestAsset.name)}`,
              size: latestAsset.size || 0,
              versions
            };

            const screenshots = readmeImages(readme);
            if (screenshots.length) app.screenshotURLs = screenshots;

            return { releaseKey: releaseKey(latest), app };
          }

          async function main() {
            const config = readJson("config.json", null);
            if (!config) throw new Error("config.json is missing or invalid");

            if (!Array.isArray(config.repositories) || !config.repositories.length) {
              throw new Error("config.json must contain a non-empty repositories array");
            }

            const sourceConfig = config.source || {};
            const output = config.output || "frizzlem.json";
            const maxVersions = Math.max(1, Number(config.max_versions) || 50);
            const cache = readJson(CACHE_FILE, { repositories: {} });

            if (!cache.repositories) cache.repositories = {};

            const configuredKeys = new Set(
              config.repositories.map(item =>
                repoKey(item.owner || "", item.name || "")
              )
            );

            for (const key of Object.keys(cache.repositories)) {
              if (!configuredKeys.has(key)) delete cache.repositories[key];
            }

            const source = {
              name: sourceConfig.name || "AltSource",
              identifier: sourceConfig.identifier || "com.example.altsource",
              iconURL: sourceConfig.iconURL || "",
              apps: [],
              version: sourceConfig.version ?? 1,
              apiVersion: sourceConfig.apiVersion ?? "v1"
            };

            const failures = [];

            for (const item of config.repositories) {
              const owner = String(item.owner || "").trim();
              const name = String(item.name || "").trim();

              if (!owner || !name) {
                failures.push("A repository is missing its owner or name");
                continue;
              }

              const key = repoKey(owner, name);
              const cached = cache.repositories[key];

              console.log(`\nChecking ${owner}/${name}`);

              try {
                const releases = await allReleases(owner, name);
                const qualifying = validReleases(releases);

                if (!qualifying.length) {
                  throw new Error("No eligible published IPA releases found");
                }

                const latestKey = releaseKey(qualifying[0]);
                const unchanged =
                  cached?.app &&
                  JSON.stringify(cached.releaseKey) === JSON.stringify(latestKey) &&
                  Number(cached.maxVersions) === maxVersions;

                if (unchanged) {
                  source.apps.push(cached.app);
                  console.log(`  Unchanged: ${cached.app.version}`);
                  continue;
                }

                const repository = await api(
                  `${API}/repos/${encodeURIComponent(owner)}/${encodeURIComponent(name)}`
                );

                const built = await buildApp(
                  owner, name, repository, releases, maxVersions
                );

                cache.repositories[key] = {
                  ...built,
                  maxVersions
                };

                source.apps.push(built.app);
                console.log(`  Updated: ${built.app.version}`);
              } catch (error) {
                console.error(`  ERROR for ${owner}/${name}: ${error.stack || error}`);

                if (cached?.app) {
                  source.apps.push(cached.app);
                  console.log("  Keeping previously cached app.");
                } else {
                  failures.push(`${owner}/${name}: ${error.message}`);
                }
              }
            }

            if (!source.apps.length || failures.length) {
              throw new Error(
                `AltSource not written. ${source.apps.length} app(s) built; ` +
                `${failures.length} repository failure(s).\n` +
                failures.join("\n")
              );
            }

            writeJson(output, source);
            writeJson(CACHE_FILE, cache);

            console.log(`\nSUCCESS: generated ${source.apps.length} app(s) in ${output}`);
          }

          main().catch(error => {
            console.error(`\nFATAL: ${error.stack || error}`);
            process.exit(1);
          });
          NODE

      - name: Validate AltSource
        run: |
          python3 - <<'PY'
          import json
          import os

          with open("config.json", encoding="utf-8") as file:
              config = json.load(file)

          output = config.get("output") or "frizzlem.json"

          if not os.path.isfile(output):
              raise SystemExit(f"ERROR: {output} was not created")

          with open(output, encoding="utf-8") as file:
              source = json.load(file)

          apps = source.get("apps")
          if not isinstance(apps, list) or not apps:
              raise SystemExit("ERROR: AltSource has no apps; refusing to publish it")

          for app in apps:
              for field in ("name", "bundleIdentifier", "version", "downloadURL"):
                  if not app.get(field):
                      raise SystemExit(
                          f"ERROR: {app.get('name', 'Unknown app')} is missing {field}"
                      )

          print(f"Validated {len(apps)} app(s) in {output}")
          PY

      - name: Commit changes
        env:
          OUTPUT: ${{ vars.ALTSOURCE_OUTPUT }}
        run: |
          OUTPUT="${OUTPUT:-frizzlem.json}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$OUTPUT" .frizzlem-cache.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update AltSource"
          git push
